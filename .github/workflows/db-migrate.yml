name: Database Migration

# Production migrations are reviewed and applied manually in Supabase.
# Keep this workflow manual-only to avoid replaying migrations already applied there.
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - run: npm ci

      - name: Verify production Supabase project
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: fytkptzbnhfsqsktmzpx
        run: |
          node - <<'NODE'
          const databaseUrl = process.env.DATABASE_URL;
          const expectedRef = process.env.EXPECTED_SUPABASE_PROJECT_REF;

          if (!databaseUrl) {
            throw new Error('PRODUCTION_DATABASE_URL is not configured');
          }

          const parsed = new URL(databaseUrl);
          const connectionIdentity = `${parsed.username}@${parsed.hostname}`;

          if (!connectionIdentity.includes(expectedRef)) {
            throw new Error(
              `Migration target mismatch: expected Supabase project ${expectedRef}`,
            );
          }

          console.log(`Verified production Supabase project: ${expectedRef}`);
          NODE

      - name: Apply pending migrations to production
        run: npm run db:migrate --workspace=@newland/db
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
